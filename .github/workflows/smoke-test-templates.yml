name: Smoke test templates

# Scaffolds a project from each template out of the packed .nupkg (the real
# end-user path, so this also proves the package content is complete), then
# builds and runs it to prove the templates produce working projects before
# they can be published. Read-only, no secrets.

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'OpenIDProviderTemplate/**'
      - 'ReactTemplate/**'
      - 'Abblix.Templates.csproj'
      - '.github/workflows/smoke-test-templates.yml'
  push:
    branches: [master]
    paths:
      - 'OpenIDProviderTemplate/**'
      - 'ReactTemplate/**'
      - 'Abblix.Templates.csproj'
      - '.github/workflows/smoke-test-templates.yml'

permissions:
  contents: read

concurrency:
  # Idempotent read-only test - cancel a superseded run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Scaffold, build and run both templates
    runs-on: ubuntu-latest
    # 20m override on the 5m baseline: one job packs the template, then for each
    # of the two templates does a cold dotnet restore, npm install, vite build,
    # publish and a live host run. Tighten to observed + 20% after the first run.
    timeout-minutes: 20
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
        timeout-minutes: 3

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
        timeout-minutes: 3

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0'
        timeout-minutes: 3

      - name: Setup Node
        # Pinned because the React template's Vite has a FLOOR, not because any particular version is
        # wanted: vite 8.1.4 declares engines ^20.19.0 || >=22.12.0, so a runner whose default drifts
        # below that breaks the build. 24 is the active LTS and clears the floor; 22 is still supported
        # (until 2027-04-30) and was not wrong, so this is alignment rather than a security fix - unlike
        # the Docs pipeline, which was sitting on Node 20 after its end-of-life. The earlier note here
        # justified the pin by "the runner default is 20", which has not been true for some time; a
        # justification that has quietly stopped holding argues against the next correction.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
        timeout-minutes: 3

      - name: Pack templates
        run: dotnet pack Abblix.Templates.csproj -c Release -o "$RUNNER_TEMP/nupkg"
        timeout-minutes: 5

      - name: Install template package from .nupkg
        run: dotnet new install "$RUNNER_TEMP"/nupkg/Abblix.Templates.*.nupkg
        timeout-minutes: 3

      - name: OIDC provider (Identity + EF) - scaffold, build, serve discovery
        # The production template: Identity + EF/SQLite users, durable client and
        # signing-key stores, Bootstrap bundled from ClientAssets by Vite. Builds,
        # runs it (seeds SQLite on first start; no --user so no console pause) and
        # checks discovery + jwks. 8m: cold npm install, vite build, EF restore.
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/oidc"
          dotnet new abblix-oidc-server -n SmokeOidc -o "$work"
          dotnet build "$work" -c Release
          dotnet "$work/bin/Release/net10.0/SmokeOidc.dll" --urls http://localhost:5080 &
          pid=$!
          ok=0
          for _ in $(seq 1 40); do
            if curl -sf http://localhost:5080/.well-known/openid-configuration -o disco.json; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "::error::OIDC discovery endpoint did not respond"; exit 1; }
          grep -q '"issuer"' disco.json || { echo "::error::discovery response has no issuer"; exit 1; }
          curl -sf http://localhost:5080/.well-known/jwks -o jwks.json 2>/dev/null || true
          echo "OIDC provider template OK"
        timeout-minutes: 8

      - name: OIDC getting-started (in-memory) - scaffold, build, serve discovery
        # The learning template: in-memory stores and an ephemeral key, no npm.
        # 5m: dotnet restore of Abblix.Oidc.Server.Mvc plus build and a host run.
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/oidc-gs"
          dotnet new abblix-oidc-server-gettingstarted -n SmokeOidcGs -o "$work"
          dotnet build "$work" -c Release
          dotnet "$work/bin/Release/net10.0/SmokeOidcGs.dll" --urls http://localhost:5083 &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5083/.well-known/openid-configuration -o disco-gs.json; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "::error::getting-started discovery did not respond"; exit 1; }
          grep -q '"issuer"' disco-gs.json || { echo "::error::getting-started discovery has no issuer"; exit 1; }
          echo "OIDC getting-started template OK"
        timeout-minutes: 5

      - name: React template - scaffold, publish, serve SPA
        # dotnet publish runs the PublishRunWebpack target (npm install + vite
        # build) and copies dist into wwwroot; then serve the published host and
        # confirm it returns the SPA shell. 8m: cold npm install and vite build
        # dominate.
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/react"
          pub="$RUNNER_TEMP/react-pub"
          dotnet new abblix-react -n SmokeReact -o "$work"
          dotnet publish "$work" -c Release -o "$pub"
          test -f "$pub/wwwroot/index.html" || { echo "::error::SPA index.html not published to wwwroot"; exit 1; }
          dotnet "$pub/SmokeReact.dll" --urls http://localhost:5081 &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5081/ -o root.html; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "::error::React host did not serve root"; exit 1; }
          grep -q 'id="root"' root.html || { echo "::error::served root is not the SPA shell"; exit 1; }
          echo "React template OK"
        timeout-minutes: 8
