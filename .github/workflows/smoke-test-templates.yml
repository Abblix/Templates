name: Smoke test templates

# Scaffolds a project from each template out of the packed .nupkg (the real
# end-user path, so this also proves the package content is complete), then
# builds and runs it to prove the templates produce working projects before
# they can be published. Read-only, no secrets.

on:
  workflow_dispatch:
  pull_request:
    branches: [master, 'release/**']
    paths:
      # OpenIDProviderIdentityTemplate is the directory behind the `abblix-oidc-server` short name, the
      # flagship template this workflow scaffolds first. It was absent from this list, so a change to it
      # ran no smoke test at all - the directory name and the template name do not match, which is how a
      # path filter comes to omit the very thing it is meant to guard.
      - 'OpenIDProviderIdentityTemplate/**'
      - 'OpenIDProviderTemplate/**'
      - 'ReactTemplate/**'
      - 'Abblix.Templates.csproj'
      - '.github/workflows/smoke-test-templates.yml'
  push:
    branches: [master]
    paths:
      # OpenIDProviderIdentityTemplate is the directory behind the `abblix-oidc-server` short name, the
      # flagship template this workflow scaffolds first. It was absent from this list, so a change to it
      # ran no smoke test at all - the directory name and the template name do not match, which is how a
      # path filter comes to omit the very thing it is meant to guard.
      - 'OpenIDProviderIdentityTemplate/**'
      - 'OpenIDProviderTemplate/**'
      - 'ReactTemplate/**'
      - 'Abblix.Templates.csproj'
      - '.github/workflows/smoke-test-templates.yml'

permissions:
  contents: read

concurrency:
  # Idempotent read-only test - cancel a superseded run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Scaffold, build and run both templates
    runs-on: ubuntu-latest
    # Back to the 5m baseline, with no override, because the whole job is now MEASURED at 61s on a
    # cold runner - packing, three scaffolds, three builds, an npm install, a vite build, a publish and
    # three live host runs. The old 20m was not a measurement of anything: no run had ever finished, so
    # the number was picked to be safe, and that is exactly what let a hung run burn 25 minutes twice.
    timeout-minutes: 5
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
        timeout-minutes: 3

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
        timeout-minutes: 3

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          # Both, because the templates do not share one: the OpenID provider templates target .NET 11, which
          # Abblix OIDC Server 3.0 requires, and the React template still targets .NET 10, whose runtime its
          # published host needs to start.
          dotnet-version: |
            10.0.x
            11.0.x
        timeout-minutes: 3

      - name: Create the ASP.NET Core development certificate
        # The OpenID provider templates serve their issuer over HTTPS, which their OpenID endpoints require, and
        # with no certificate configured Kestrel serves HTTPS with this one. The runner does not trust it, so
        # the checks below call curl with -k.
        run: dotnet dev-certs https
        timeout-minutes: 3

      - name: Setup Node
        # Pinned because the React template's Vite has a FLOOR, not because any particular version is
        # wanted: vite 8.1.4 declares engines ^20.19.0 || >=22.12.0, so a runner whose default drifts
        # below that breaks the build. 24 is the active LTS and clears the floor; 22 is still supported
        # (until 2027-04-30) and was not wrong, so this is alignment rather than a security fix. The
        # earlier note here justified the pin by "the runner default is 20", which has not been true
        # for some time; a justification that has quietly stopped holding argues against the next
        # correction.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
        timeout-minutes: 3

      - name: Pack templates
        run: dotnet pack Abblix.Templates.csproj -c Release -o "$RUNNER_TEMP/nupkg"
        # Baseline 3m; measured 12s.
        timeout-minutes: 3

      - name: Install template package from .nupkg
        run: dotnet new install "$RUNNER_TEMP"/nupkg/Abblix.Templates.*.nupkg
        timeout-minutes: 3

      # No template below may declare a script post-action, and that is a requirement of this workflow
      # rather than a preference. `dotnet new` defaults such an action to Prompt, and on a runner stdin
      # is at EOF: the read returns empty, the CLI re-prompts, and it spins at full speed until the job
      # ceiling. That ended both runs this workflow had before 2026-07-30, at exactly 25:00 against a
      # 20m limit, with the step's own 8m timeout never preempting it.
      #
      # It cannot be guarded with `--allow-scripts` here, which is the counter-intuitive part: the CLI
      # offers that option only WHILE a template declares such an action, so on these templates it is
      # rejected outright and the step dies with exit 127. The option and the hazard appear and vanish
      # together. What keeps CI safe is therefore the absence, plus the reason it can stay absent: each
      # template's csproj already restores npm when node_modules is missing, so a post-action doing the
      # same buys nothing and costs an interactive prompt.
      - name: OIDC provider (Identity + EF) - scaffold, build, send its requests
        # The production template: Identity + EF/SQLite users, durable client and
        # signing-key stores, Bootstrap bundled from ClientAssets by Vite. Builds,
        # runs it (seeds SQLite and the --user on first start; --password is given, so no console pause;
        # its quote and backslash land in a C# literal, so a broken escaping form fails the build) and
        # sends the requests of its requests.http: discovery, jwks, a client credentials token and its
        # introspection. The heaviest step: cold npm install, vite build, EF restore.
        # Created WITHOUT --https-port, so it proves the generated-port path: the address is read back
        # from the project's launchSettings.json, must carry a port from the generator's range, and must
        # be both where the host answers and the issuer discovery names.
        env:
          # Only appsettings.Development.json declares the demo clients, console_client among them; the host
          # otherwise starts as Production with none and refuses the token request below. The last run
          # overrides it with Production to prove exactly that refusal.
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/oidc"
          dotnet new abblix-oidc-server -n SmokeOidc -o "$work" --user smoke@example.com --password 'Sm0ke!"pass\word'
          url=$(jq -er '.profiles.https.applicationUrl' "$work/Properties/launchSettings.json")
          port="${url##*:}"
          [ "$url" = "https://localhost:$port" ] && [ "$port" -ge 7000 ] && [ "$port" -le 7300 ] ||
            { echo "::error::launchSettings.json names $url, not a port generated between 7000 and 7300"; exit 1; }
          echo "Generated address: $url"
          dotnet build "$work" -c Release
          # From the OUTPUT directory, not from the checkout. appsettings.json sits next to the dll
          # and ASP.NET Core resolves it against the working directory, so starting the app anywhere
          # else loads NO configuration: every connection string comes back null, EF hands SQLite an
          # empty data source, and an empty data source means a private temporary database per
          # connection. EnsureCreated then creates the tables in one throwaway database and the next
          # query opens another, so the app dies on "no such table: SigningKeys" and the whole thing
          # reads as a broken template. Measured both ways: from the checkout, not one .db file exists
          # anywhere afterwards; from here, discovery answers and oidc.db/users.db are on disk.
          cd "$work/bin/Release/net11.0"
          # At the address launchSettings.json names, over HTTPS, which the OpenID endpoints require.
          dotnet ./SmokeOidc.dll --urls "$url" &
          pid=$!
          ok=0
          for _ in $(seq 1 40); do
            if curl -skf "$url/.well-known/openid-configuration" -o disco.json; then ok=1; break; fi
            sleep 1
          done
          jwks=0
          curl -skf "$url/.well-known/jwks" -o jwks.json && jwks=1
          token=0
          curl -skf "$url/connect/token" -d grant_type=client_credentials -d client_id=console_client \
            -d client_secret=secret -o token.json && token=1
          introspection=0
          if [ "$token" = 1 ] && access_token=$(jq -er '.access_token' token.json); then
            curl -skf "$url/connect/introspect" --data-urlencode "token=$access_token" \
              -d client_id=console_client -d client_secret=secret -o introspection.json && introspection=1
          fi
          # Holds only while https://localhost:5004 is a registered resource: an unknown one is refused too.
          refused=$(curl -sk -o refused.json -w '%{http_code}' "$url/connect/token" -d grant_type=client_credentials \
            -d client_id=console_client -d client_secret=secret -d resource=https://localhost:5004) || refused=none
          # Waited for, so the next template can take the same address.
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "::error::OIDC discovery endpoint did not respond"; exit 1; }
          jq -e --arg url "$url" '.issuer == $url' disco.json > /dev/null ||
            { echo "::error::discovery does not name $url, the address in launchSettings.json, as its issuer"; exit 1; }
          [ "$jwks" = 1 ] || { echo "::error::OIDC jwks endpoint did not respond"; exit 1; }
          # Exactly one: the template persists one signing key, and a provider serving none signs nothing.
          jq -e '.keys | length == 1' jwks.json > /dev/null ||
            { echo "::error::jwks does not serve exactly one signing key"; exit 1; }
          jq -e --arg url "$url" '.introspection_endpoint == $url + "/connect/introspect"' disco.json > /dev/null ||
            { echo "::error::OIDC discovery does not name $url/connect/introspect as its introspection endpoint"; exit 1; }
          [ "$token" = 1 ] || { echo "::error::OIDC token endpoint issued no token to console_client"; exit 1; }
          [ "$introspection" = 1 ] || { echo "::error::OIDC introspection endpoint did not answer for the token just issued"; exit 1; }
          jq -e '.active == true and .client_id == "console_client"' introspection.json > /dev/null ||
            { echo "::error::OIDC introspection does not report the token just issued as active for console_client"; exit 1; }
          if [ "$refused" != 400 ] || ! jq -e '.error == "invalid_target"' refused.json > /dev/null; then
            echo "::error::OIDC token endpoint did not refuse console_client a token for https://localhost:5004 with 400 invalid_target"
            exit 1
          fi
          # Again in Production, on a database never run in Development: the template must start there, and with
          # no client in appsettings.json the demo clients' published secret must open nothing.
          rm -f oidc.db oidc.db-wal oidc.db-shm
          ASPNETCORE_ENVIRONMENT=Production dotnet ./SmokeOidc.dll --urls "$url" &
          pid=$!
          ok=0
          for _ in $(seq 1 40); do
            if curl -skf "$url/.well-known/openid-configuration" -o /dev/null; then ok=1; break; fi
            sleep 1
          done
          unseeded=$(curl -sk -o unseeded.json -w '%{http_code}' "$url/connect/token" -d grant_type=client_credentials \
            -d client_id=console_client -d client_secret=secret) || unseeded=none
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "::error::OIDC provider template did not start in Production: discovery did not respond"; exit 1; }
          if [ "$unseeded" != 401 ] || ! jq -e '.error == "invalid_client"' unseeded.json > /dev/null; then
            echo "::error::OIDC provider template declares a demo client outside appsettings.Development.json: in Production console_client with the published secret was not refused with 401 invalid_client"
            exit 1
          fi
          echo "OIDC provider template OK"
        # Baseline 3m; measured 35s with the Production run, the heaviest of the three (it carries the cold
        # NuGet restore).
        timeout-minutes: 3

      - name: OIDC getting-started (in-memory) - scaffold, build, send its requests
        # The learning template: in-memory stores and an ephemeral key, no npm.
        # Created WITH --https-port, so it proves the explicit-port path. The port lies outside the
        # generator's range, so a project that ignored the option could not pass by chance.
        # --user and --password carry a quote, a backslash and braces, which land in C# literals in
        # Program.cs: a broken escaping form leaves a literal the build refuses.
        env:
          # For the reason given in the step above: console_client and test_client exist only in Development.
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/oidc-gs"
          url="https://localhost:5443"
          dotnet new abblix-oidc-server-gettingstarted -n SmokeOidcGs -o "$work" --https-port 5443 --user 'a"b\{c}' --password 'p"\q'
          jq -e --arg url "$url" '.profiles.https.applicationUrl == $url' "$work/Properties/launchSettings.json" > /dev/null ||
            { echo "::error::launchSettings.json does not name $url, the address given with --https-port"; exit 1; }
          dotnet build "$work" -c Release
          # From the output directory, for the reason spelled out in the step above.
          cd "$work/bin/Release/net11.0"
          # At the address given with --https-port, over HTTPS, for the reason given in the step above.
          dotnet ./SmokeOidcGs.dll --urls "$url" &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -skf "$url/.well-known/openid-configuration" -o disco-gs.json; then ok=1; break; fi
            sleep 1
          done
          jwks=0
          curl -skf "$url/.well-known/jwks" -o jwks-gs.json && jwks=1
          # The third and fourth requests of the project's requests.http: a token for console_client from the
          # client credentials grant, then introspection of that token by the same client.
          token=0
          curl -skf "$url/connect/token" -d grant_type=client_credentials -d client_id=console_client \
            -d client_secret=secret -o token-gs.json && token=1
          introspection=0
          if [ "$token" = 1 ] && access_token=$(jq -er '.access_token' token-gs.json); then
            curl -skf "$url/connect/introspect" --data-urlencode "token=$access_token" \
              -d client_id=console_client -d client_secret=secret -o introspection-gs.json && introspection=1
          fi
          # The sign-in that requests.http walks through in a browser, as test_client: the authorization request
          # answers with the login page, the --user signs in there, the provider sends the browser on to the
          # redirect URI with a code, and the code is exchanged for tokens with the verifier of code_challenge.
          authorize="$url/connect/authorize?client_id=test_client&response_type=code&scope=openid%20profile%20email&state=smoke&redirect_uri=http%3A%2F%2F127.0.0.1%2Fcallback&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256"
          signin=0
          if login=$(curl -sk -b jar-gs -c jar-gs -o /dev/null -w '%{redirect_url}' "$authorize") &&
            [ "${login%%\?*}" = "$url/Auth/Login" ] &&
            back=$(curl -sk -b jar-gs -c jar-gs -o /dev/null -w '%{redirect_url}' "$url/Auth/Login" \
              --data-urlencode 'email=a"b\{c}' --data-urlencode 'password=p"\q' -d "requestUri=${login#*request_uri=}") &&
            callback=$(curl -sk -b jar-gs -c jar-gs -o /dev/null -w '%{redirect_url}' "$back") &&
            authorization_code=$(python3 -I -c 'import sys, urllib.parse as p
          u = p.urlsplit(sys.argv[1]); q = p.parse_qs(u.query)
          assert p.urlunsplit(u._replace(query="")) == "http://127.0.0.1/callback" and q["state"] == ["smoke"], u
          print(q["code"][0])' "$callback"); then
            signin=1
          fi
          # Without -f, so a refusal keeps its body, whose error and error_description the check below prints.
          exchange=none
          if [ "$signin" = 1 ]; then
            exchange=$(curl -sk -o code-token-gs.json -w '%{http_code}' "$url/connect/token" -d grant_type=authorization_code \
              --data-urlencode "code=$authorization_code" -d redirect_uri=http%3A%2F%2F127.0.0.1%2Fcallback \
              -d code_verifier=dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk -d client_id=test_client -d client_secret=secret) ||
              exchange=none
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "::error::getting-started discovery did not respond"; exit 1; }
          jq -e --arg url "$url" '.issuer == $url' disco-gs.json > /dev/null ||
            { echo "::error::getting-started discovery does not name $url, the address given with --https-port, as its issuer"; exit 1; }
          [ "$jwks" = 1 ] || { echo "::error::getting-started jwks endpoint did not respond"; exit 1; }
          # Exactly one: the template generates one signing key at startup.
          jq -e '.keys | length == 1' jwks-gs.json > /dev/null ||
            { echo "::error::getting-started jwks does not serve exactly one signing key"; exit 1; }
          jq -e --arg url "$url" '.introspection_endpoint == $url + "/connect/introspect"' disco-gs.json > /dev/null ||
            { echo "::error::getting-started discovery does not name $url/connect/introspect as its introspection endpoint"; exit 1; }
          [ "$token" = 1 ] || { echo "::error::getting-started token endpoint issued no token to console_client"; exit 1; }
          [ "$introspection" = 1 ] || { echo "::error::getting-started introspection endpoint did not answer for the token just issued"; exit 1; }
          jq -e '.active == true and .client_id == "console_client"' introspection-gs.json > /dev/null ||
            { echo "::error::getting-started introspection does not report the token just issued as active for console_client"; exit 1; }
          [ "$signin" = 1 ] ||
            { echo "::error::getting-started sign-in as test_client did not reach a code: login page '${login:-}', after sign-in '${back:-}', callback '${callback:-}'"; exit 1; }
          if [ "$exchange" != 200 ]; then
            refusal=$(jq -r '"\(.error) (\(.error_description))"' code-token-gs.json 2>/dev/null) || refusal="no JSON body"
            echo "::error::getting-started token endpoint answered the code of test_client with $exchange: $refusal"
            exit 1
          fi
          jq -e '(.id_token | type == "string") and (.access_token | type == "string") and .token_type == "Bearer"' code-token-gs.json > /dev/null ||
            { echo "::error::getting-started token endpoint did not answer the code of test_client with an id_token and a Bearer access_token"; exit 1; }
          # Again in Production, where appsettings.json must declare no client, as in the step above.
          ASPNETCORE_ENVIRONMENT=Production dotnet ./SmokeOidcGs.dll --urls "$url" &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -skf "$url/.well-known/openid-configuration" -o /dev/null; then ok=1; break; fi
            sleep 1
          done
          unseeded=$(curl -sk -o unseeded-gs.json -w '%{http_code}' "$url/connect/token" -d grant_type=client_credentials \
            -d client_id=console_client -d client_secret=secret) || unseeded=none
          unknown=$(curl -sk -o unknown-gs.json -w '%{http_code}' "$authorize") || unknown=none
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "::error::getting-started template did not start in Production: discovery did not respond"; exit 1; }
          if [ "$unseeded" != 401 ] || ! jq -e '.error == "invalid_client"' unseeded-gs.json > /dev/null; then
            echo "::error::getting-started template declares a demo client outside appsettings.Development.json: in Production console_client with the published secret was not refused with 401 invalid_client"
            exit 1
          fi
          if [ "$unknown" != 400 ] || ! jq -e '.error == "unauthorized_client"' unknown-gs.json > /dev/null; then
            echo "::error::getting-started template declares a demo client outside appsettings.Development.json: in Production the authorization request of test_client was not refused with 400 unauthorized_client"
            exit 1
          fi
          echo "OIDC getting-started template OK"
        # Baseline 3m; measured 9s and 32s with the sign-in and the Production run, in the SDK 11 image.
        timeout-minutes: 3

      - name: React template - scaffold, publish, serve SPA
        # dotnet publish runs the PublishRunWebpack target (npm install + vite
        # build) and copies dist into wwwroot; then serve the published host and
        # confirm it returns the SPA shell. Cold npm install and vite build
        # dominate.
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/react"
          pub="$RUNNER_TEMP/react-pub"
          dotnet new abblix-react -n SmokeReact -o "$work"
          # Both ports are generated: the host's, read back from launchSettings.json, and the Vite dev
          # server's, read back from the project's SpaProxyServerUrl as MSBuild evaluates it.
          url=$(jq -er '.profiles.https.applicationUrl' "$work/Properties/launchSettings.json")
          port="${url##*:}"
          [ "$url" = "https://localhost:$port" ] && [ "$port" -ge 7000 ] && [ "$port" -le 7300 ] ||
            { echo "::error::launchSettings.json names $url, not a port generated between 7000 and 7300"; exit 1; }
          spa=$(dotnet msbuild "$work/SmokeReact.csproj" -getProperty:SpaProxyServerUrl)
          spa_port="${spa##*:}"
          [ "$spa" = "https://localhost:$spa_port" ] && [ "$spa_port" -ge 5173 ] && [ "$spa_port" -le 5273 ] ||
            { echo "::error::SpaProxyServerUrl is $spa, not a port generated between 5173 and 5273"; exit 1; }
          echo "Generated addresses: host $url, dev server $spa"
          dotnet publish "$work" -c Release -o "$pub"
          test -f "$pub/wwwroot/index.html" || { echo "::error::SPA index.html not published to wwwroot"; exit 1; }
          # From the publish directory, for the reason spelled out in the first template step.
          cd "$pub"
          # At the address launchSettings.json names, over HTTPS with the development certificate.
          dotnet ./SmokeReact.dll --urls "$url" &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -skf "$url/" -o root.html; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "::error::React host did not serve root"; exit 1; }
          grep -q 'id="root"' root.html || { echo "::error::served root is not the SPA shell"; exit 1; }
          echo "React template OK"
        # Baseline 3m; measured 7s.
        timeout-minutes: 3
