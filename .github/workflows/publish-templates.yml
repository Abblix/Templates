name: Publish templates to NuGet and the Visual Studio Marketplace

# Manual-only publish of the Abblix.Templates package to NuGet.org and of the Visual Studio extension
# that carries the same package to the Visual Studio Marketplace.
# The package version is set explicitly by <PackageVersion> in
# Abblix.Templates.csproj (no MinVer here) - bump it there before running.
# NuGet.org rejects re-upload of an existing version; --skip-duplicate keeps a
# re-run idempotent rather than failing. The Marketplace replaces an extension of the same version,
# so a re-run publishes the same extension again.
#
# One package for both: the pack job builds the .nupkg once and records its SHA-256, and the
# NuGet.org job and the extension build download it and refuse a file with any other digest, so
# within a run NuGet.org and the extension carry the same templates. A dry run packs the package
# and builds the extension without an approval.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack the package and build the extension, list both; do not attest or publish'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Pushing to the public NuGet feed mutates external state - never cancel a run
  # mid-push (it would leave a partial upload); queue the next dispatch instead.
  group: publish-templates
  cancel-in-progress: false

jobs:
  pack:
    name: Pack Abblix.Templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
      on_nuget: ${{ steps.published.outputs.on_nuget }}
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
        timeout-minutes: 3

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
        timeout-minutes: 3

      # The packing project targets net10.0 and carries the templates as content only, so the
      # templates' own net11.0 target needs no .NET 11 SDK here.
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0'
        timeout-minutes: 3

      - name: Pack
        run: dotnet pack Abblix.Templates.csproj -c Release -o nupkg
        timeout-minutes: 3

      # NuGet.org never replaces a version, so when this version is already published the release
      # carries the published file rather than the fresh pack: the extension then holds the bytes
      # NuGet.org serves, and the NuGet.org job, which has nothing to push, does not run.
      - name: Take the published package when this version is on NuGet.org
        id: published
        run: |
          set -euo pipefail
          version=$(python3 - nupkg/*.nupkg <<'PY'
          import sys, zipfile, xml.etree.ElementTree as ET
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = [n for n in z.namelist() if "/" not in n and n.endswith(".nuspec")]
              if len(names) != 1:
                  sys.exit(f"expected one nuspec at the package root, found {len(names)}")
              root = ET.fromstring(z.read(names[0]))
          version = next((e.text for e in root.iter() if e.tag.rsplit("}", 1)[-1] == "version"), None)
          if not version:
              sys.exit("the nuspec carries no version")
          print(version.strip())
          PY
          )
          lower=$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]')
          url="https://api.nuget.org/v3-flatcontainer/abblix.templates/${lower}/abblix.templates.${lower}.nupkg"
          if ! status=$(curl -sS -o published.nupkg -w '%{http_code}' "$url"); then
            echo "::error title=NuGet.org::NuGet.org could not be reached to ask for Abblix.Templates $version. Skipped step: none; re-run the failed job once NuGet.org answers"
            exit 1
          fi
          case "$status" in
            200)
              rm nupkg/*.nupkg
              mv published.nupkg "nupkg/Abblix.Templates.${version}.nupkg"
              echo "on_nuget=true" >> "$GITHUB_OUTPUT"
              echo "Abblix.Templates $version is already on NuGet.org: the release carries the published package"
              ;;
            404)
              rm -f published.nupkg
              echo "on_nuget=false" >> "$GITHUB_OUTPUT"
              echo "Abblix.Templates $version is not on NuGet.org yet: the release carries the fresh pack"
              ;;
            *)
              echo "::error title=NuGet.org::Asking NuGet.org for Abblix.Templates $version answered HTTP $status. Skipped step: none; re-run the failed job once NuGet.org answers"
              exit 1
              ;;
          esac
        timeout-minutes: 3

      # A dry run is inspected from this listing.
      - name: List package contents
        run: |
          set -euo pipefail
          for f in nupkg/*.nupkg; do
            python3 -m zipfile -l "$f"
          done
        timeout-minutes: 3

      - name: Record the package digest
        id: digest
        run: |
          set -euo pipefail
          count=$(find nupkg -maxdepth 1 -name '*.nupkg' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error title=Pack::Expected exactly one package in nupkg, found $count"
            exit 1
          fi
          sum=$(sha256sum nupkg/*.nupkg | cut -d' ' -f1)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "Package digest: $sum"
        timeout-minutes: 3

      # The extension and NuGet.org jobs read the package from here; the digest above is what they
      # check it against. Three days leave room for an approval or a re-run after a day's wait.
      - name: Hand the package to the publishing jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: templates-package
          path: nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 3
        timeout-minutes: 3

  # NuGet.org trusted publishing: the job proves its identity with GitHub's OIDC token and receives a
  # one-hour, single-use API key for this push, so no long-lived key is stored. The nuget.org policy
  # names this repository, this workflow file and the publish-packages environment, so another
  # workflow or a run without the approval cannot obtain a key.
  nuget:
    name: Publish Abblix.Templates to NuGet.org
    # Waits for the extension build too, so a package the extension cannot carry is never pushed.
    needs: [pack, extension]
    # A version already on NuGet.org has nothing to push.
    if: ${{ !inputs.dry_run && needs.pack.outputs.on_nuget != 'true' }}
    runs-on: ubuntu-latest
    # The run waits for a reviewer's approval before any step starts, and the NUGET_USER secret the
    # key exchange needs lives in this environment.
    environment: publish-packages
    # 10m override on the 5m baseline: NuGet.org index sync after push can lag.
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore OIDC for build-provenance attestation, and the NuGet.org key exchange
      attestations: write # record SLSA L3 provenance in the repo
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
        timeout-minutes: 3

      # Refuses before anything is attested: a missing setup is the likeliest failure of the first
      # real run, and a refusal after the attestation would leave one for a package that was never
      # published.
      - name: NuGet.org user for trusted publishing
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error title=NuGet.org trusted publishing::The publish-packages environment has no NUGET_USER secret. Skipped step: create the trusted publishing policy at https://www.nuget.org/account/trustedpublishing (owner Abblix; repository owner Abblix, repository Templates, workflow file publish-templates.yml, environment publish-packages, scope allowing new packages and new versions for the glob Abblix.Templates) and set the publish-packages environment secret NUGET_USER to the nuget.org profile name of the policy creator, then re-run the failed job"
            exit 1
          fi
        timeout-minutes: 3

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: templates-package
          path: nupkg
        timeout-minutes: 3

      - name: Check the package is the one packed
        env:
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          count=$(find nupkg -maxdepth 1 -name '*.nupkg' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error title=Package digest::Expected exactly one downloaded package, found $count"
            exit 1
          fi
          actual=$(sha256sum nupkg/*.nupkg | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error title=Package digest::The downloaded package has SHA-256 $actual, the pack job recorded $EXPECTED_SHA256. Skipped step: none can be redone here; dispatch the workflow anew so the package is packed again"
            exit 1
          fi
        timeout-minutes: 3

      # Requested before the attestation, so a run NuGet.org issues no key to leaves no attestation
      # behind; the key is valid for one hour, far longer than the steps up to the push.
      - name: Get a short-lived NuGet.org key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
        timeout-minutes: 3

      - name: Name the skipped step when no key was issued
        if: ${{ failure() && steps.login.outcome == 'failure' }}
        run: |
          echo "::error title=NuGet.org trusted publishing::NuGet.org issued no key for this run. Skipped step: create the trusted publishing policy at https://www.nuget.org/account/trustedpublishing (owner Abblix; repository owner Abblix, repository Templates, workflow file publish-templates.yml, environment publish-packages, scope allowing new packages and new versions for the glob Abblix.Templates) and set the publish-packages environment secret NUGET_USER to the nuget.org profile name of the policy creator; if the policy shows as inactive because its 7-day window passed without a publish, restart the window there. Then re-run the failed job"
          exit 1
        timeout-minutes: 3

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: 'nupkg/*.nupkg'
        timeout-minutes: 3

      - name: Push to NuGet.org
        id: push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for pkg in nupkg/*.nupkg; do
            echo "Publishing $(basename "$pkg") to nuget.org..."
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
        timeout-minutes: 5

      - name: Name the skipped step when NuGet.org refused the package
        if: ${{ failure() && steps.push.outcome == 'failure' }}
        run: |
          echo "::error title=NuGet.org trusted publishing::NuGet.org refused Abblix.Templates; the push log above names the reason. Skipped step: when it names ownership or the key, make the trusted publishing policy's owner (Abblix) an owner of Abblix.Templates and let the policy's scope allow new packages and new versions for the glob Abblix.Templates at https://www.nuget.org/account/trustedpublishing, then re-run the failed job. When it names the package itself (id, version, metadata), fix Abblix.Templates.csproj, merge the fix into master and dispatch the workflow anew from master, the only branch the publish-packages environment admits: a re-run publishes the same package again"
          exit 1
        timeout-minutes: 3

      - name: Summary
        run: |
          set -euo pipefail
          PKG=$(find nupkg -maxdepth 1 -name 'Abblix.Templates.*.nupkg' | head -1 || true)
          if [ -n "$PKG" ]; then
            VERSION=$(basename "$PKG" .nupkg | sed 's|^Abblix.Templates.||')
            {
              echo "## Templates package"
              echo ""
              echo "Package: \`$(basename "$PKG")\`"
              echo "Version: \`$VERSION\`"
              echo ""
              echo "Pushed to https://www.nuget.org/packages/Abblix.Templates"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        timeout-minutes: 3

  # Builds the Visual Studio extension around the packed package. It holds no secret and waits for no
  # approval, so a dry run from any branch exercises it, and both publishing jobs wait for it: a
  # package the extension cannot carry (a prerelease, a build failure) stops the release before
  # either registry receives anything.
  extension:
    name: Build the Visual Studio extension
    needs: pack
    # A job that needs Windows runs on a GitHub-hosted Windows runner: the Visual Studio SDK that
    # builds the VSIX runs VsixUtil.exe, which exists only for Windows.
    runs-on: windows-latest
    # 10m override on the 5m baseline: a Windows runner sets up slower than a Linux one.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.vsix.outputs.sha256 }}
      version: ${{ steps.vsix.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
        timeout-minutes: 3

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
        timeout-minutes: 3

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0'
        timeout-minutes: 3

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: templates-package
          path: nupkg
        timeout-minutes: 3

      - name: Check the package is the one packed
        env:
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -Path nupkg -Filter *.nupkg -File)
          if ($packages.Count -ne 1) {
            Write-Output "::error title=Package digest::Expected exactly one downloaded package, found $($packages.Count)"
            exit 1
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $packages[0].FullName).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            Write-Output "::error title=Package digest::The downloaded package has SHA-256 $actual, the pack job recorded $($env:EXPECTED_SHA256). Skipped step: none can be redone here; dispatch the workflow anew so the package is packed again"
            exit 1
          }
          "TEMPLATE_PACKAGE=$($packages[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        timeout-minutes: 3

      # The project takes the extension's version from the package's nuspec and refuses a
      # prerelease, whose version a VSIX cannot carry.
      - name: Build the extension
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build Vsix/Abblix.Templates.Vsix.csproj -c Release -o extension -p:RestoreLockedMode=true "-p:TemplatePackage=$env:TEMPLATE_PACKAGE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        timeout-minutes: 3

      # A dry run is inspected from this listing.
      - name: List extension contents
        id: vsix
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $files = @(Get-ChildItem -Path extension -Filter *.vsix -File)
          if ($files.Count -ne 1) {
            Write-Output "::error title=Extension::Expected exactly one .vsix in extension, found $($files.Count)"
            exit 1
          }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($files[0].FullName)
          try {
            $zip.Entries | ForEach-Object { '{0,10}  {1}' -f $_.Length, $_.FullName }
            $entry = $zip.GetEntry('extension.vsixmanifest')
            $reader = New-Object System.IO.StreamReader($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally {
            $zip.Dispose()
          }
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $files[0].FullName).Hash.ToLowerInvariant()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          @('## Visual Studio extension', '', "Version: ``$version``", '', 'Built.') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        timeout-minutes: 3

      - name: Hand the extension to the publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: templates-extension
          path: extension/*.vsix
          if-no-files-found: error
          retention-days: 3
        timeout-minutes: 3

  # Visual Studio Marketplace trusted publishing: the job exchanges GitHub's OIDC token for a
  # Marketplace credential valid for 15 minutes, so no long-lived token is stored. The Marketplace
  # policy names this repository, this workflow file and the publish-packages environment.
  marketplace:
    name: Publish the Visual Studio extension
    needs: [pack, extension]
    if: ${{ !inputs.dry_run }}
    # A job that needs Windows runs on a GitHub-hosted Windows runner: VsixPublisher.exe, which
    # publishes the extension, is a .NET Framework program that exists only for Windows.
    runs-on: windows-latest
    # The run waits for a reviewer's approval before any step starts.
    environment: publish-packages
    # 10m override on the 5m baseline: a Windows runner sets up slower, and the job talks to the
    # Marketplace twice (token exchange, upload).
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore OIDC for build-provenance attestation, and the Marketplace token exchange
      attestations: write # record SLSA L3 provenance in the repo
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: true
        timeout-minutes: 3

      # The publish manifest and the Marketplace page live in Vsix/, and restoring the extension
      # project brings VsixPublisher.exe at the version the project pins.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
        timeout-minutes: 3

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0'
        timeout-minutes: 3

      # VsixPublisher.exe in Microsoft.VSSDK.BuildTools 18.12.1606 references one version of
      # Microsoft.Identity.Client and ships another without a binding redirect, so it dies with
      # VsixPub0031 before authenticating. A copy of its folder gets the redirect to the version it
      # actually ships, read from the assembly itself.
      - name: Prepare VsixPublisher
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore Vsix/Abblix.Templates.Vsix.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packaged = (dotnet msbuild Vsix/Abblix.Templates.Vsix.csproj -getProperty:VsixPublisherPath | Out-String).Trim()
          if (-not (Test-Path -LiteralPath $packaged)) {
            Write-Output "::error title=Visual Studio Marketplace::VsixPublisher.exe not found at '$packaged', the path the extension project names inside its Microsoft.VSSDK.BuildTools package"
            exit 1
          }
          $folder = Join-Path $env:RUNNER_TEMP 'vsixpublisher'
          Copy-Item -Recurse -LiteralPath (Split-Path -Parent $packaged) -Destination $folder
          $exe = Join-Path $folder 'VsixPublisher.exe'
          $msal = Join-Path $folder 'lib/Microsoft.Identity.Client.dll'
          $msalVersion = [System.Reflection.AssemblyName]::GetAssemblyName($msal).Version.ToString()

          $configPath = "$exe.config"
          $config = New-Object System.Xml.XmlDocument
          $config.PreserveWhitespace = $true
          $config.Load($configPath)
          $ns = 'urn:schemas-microsoft-com:asm.v1'
          $names = New-Object System.Xml.XmlNamespaceManager($config.NameTable)
          $names.AddNamespace('asm', $ns)
          $binding = $config.SelectSingleNode('/configuration/runtime/asm:assemblyBinding', $names)
          if (-not $binding) {
            Write-Output "::error title=Visual Studio Marketplace::$configPath has no assemblyBinding section to add the Microsoft.Identity.Client redirect to"
            exit 1
          }
          $dependency = $config.SelectSingleNode("/configuration/runtime/asm:assemblyBinding/asm:dependentAssembly[asm:assemblyIdentity/@name='Microsoft.Identity.Client']", $names)
          if (-not $dependency) {
            $dependency = $config.CreateElement('dependentAssembly', $ns)
            $identity = $config.CreateElement('assemblyIdentity', $ns)
            $identity.SetAttribute('name', 'Microsoft.Identity.Client')
            $identity.SetAttribute('publicKeyToken', '0a613f4dd989e8ae')
            $identity.SetAttribute('culture', 'neutral')
            [void]$dependency.AppendChild($identity)
            [void]$binding.AppendChild($dependency)
          }
          $redirect = $dependency.SelectSingleNode('asm:bindingRedirect', $names)
          if (-not $redirect) {
            $redirect = $config.CreateElement('bindingRedirect', $ns)
            [void]$dependency.AppendChild($redirect)
          }
          $redirect.SetAttribute('oldVersion', "0.0.0.0-$msalVersion")
          $redirect.SetAttribute('newVersion', $msalVersion)
          $config.Save($configPath)
          Write-Output "Microsoft.Identity.Client redirected to $msalVersion"
          "VSIX_PUBLISHER=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        timeout-minutes: 3

      - name: Download the extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: templates-extension
          path: extension
        timeout-minutes: 3

      - name: Check the extension is the one built
        env:
          EXPECTED_SHA256: ${{ needs.extension.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path extension -Filter *.vsix -File)
          if ($files.Count -ne 1) {
            Write-Output "::error title=Extension digest::Expected exactly one downloaded extension, found $($files.Count)"
            exit 1
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $files[0].FullName).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            Write-Output "::error title=Extension digest::The downloaded extension has SHA-256 $actual, the build job recorded $($env:EXPECTED_SHA256). Skipped step: none can be redone here; dispatch the workflow anew so the extension is built again"
            exit 1
          }
          "VSIX_PATH=$($files[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        timeout-minutes: 3

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: 'extension/*.vsix'
        timeout-minutes: 3

      # VsixPublisher's own -oidc exchange is rejected by the Marketplace (it sends no api-version),
      # so this step makes the exchange with the contract vsce uses and hands the 15-minute
      # credential to VsixPublisher as its token. The GitHub token and the credential stay inside
      # this one step and are masked before anything could print them. Every failure writes its
      # own annotation naming the step to redo.
      - name: Publish to the Visual Studio Marketplace
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'Vsix/publishManifest.json'
          $publisherName = (Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json).publisher
          if (-not $publisherName) {
            Write-Output "::error title=Visual Studio Marketplace::$manifestPath names no publisher"
            exit 1
          }

          if (-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
            Write-Output "::error title=Visual Studio Marketplace trusted publishing::GitHub offered this job no OIDC token: the job needs the permission id-token: write"
            exit 1
          }
          $tokenUri = "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)&audience=marketplace.visualstudio.com"
          $githubToken = (Invoke-RestMethod -Method Get -Uri $tokenUri -Headers @{
              Authorization = "Bearer $($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)"
              Accept = 'application/json'
            }).value
          if (-not $githubToken) {
            Write-Output "::error title=Visual Studio Marketplace trusted publishing::GitHub returned no OIDC token for this job"
            exit 1
          }
          Write-Output "::add-mask::$githubToken"

          try {
            $exchange = Invoke-RestMethod -Method Post `
              -Uri 'https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1' `
              -Headers @{ Authorization = "FederatedToken $githubToken"; Accept = 'application/json' } `
              -ContentType 'application/json' `
              -Body (@{ publisherName = $publisherName } | ConvertTo-Json -Compress)
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            # The Marketplace answers with a JSON error whose message names the cause; an annotation
            # holds one line, so the message is taken from it rather than the whole body.
            $reason = $_.ErrorDetails.Message
            try { $reason = ($reason | ConvertFrom-Json).message } catch { $reason = "$reason" -replace '\s+', ' ' }
            Write-Output "::error title=Visual Studio Marketplace trusted publishing::The Marketplace issued no credential for this run (HTTP $status): $reason Skipped step: on https://marketplace.visualstudio.com/manage open the publisher $publisherName, select Trusted Publishing and check the policy names repository owner Abblix, repository Templates, workflow publish-templates.yml and environment publish-packages and is active; then re-run the failed job, or dispatch the workflow anew when the run is older than the three days its artifacts are kept"
            exit 1
          }
          $credential = $exchange.credential
          if (-not $credential) {
            Write-Output "::error title=Visual Studio Marketplace trusted publishing::The Marketplace answered the token exchange without a credential"
            exit 1
          }
          Write-Output "::add-mask::$credential"

          & $env:VSIX_PUBLISHER publish -payload $env:VSIX_PATH -publishManifest $manifestPath -personalAccessToken $credential
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=Visual Studio Marketplace::VsixPublisher refused the extension; its log above names the reason. Skipped step: when it names the publisher or the token, fix them on https://marketplace.visualstudio.com/manage and re-run the failed job. When it names the extension itself (manifest, overview, categories), fix the files under Vsix/, merge the fix into master and dispatch anew from master; if anything outside Vsix/ changed on master since this run, raise PackageVersion first, since NuGet.org keeps the package it already has and the extension would carry different templates under the same version"
            exit $LASTEXITCODE
          }
          @('', 'Published to the Visual Studio Marketplace.') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        timeout-minutes: 5
